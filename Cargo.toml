[package]
name = "depth2depth"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Densify and denoise metric depth images: Depth Anything V2 (via candle) affine-anchored to the trusted parts of a raw sensor depth image, filling holes and outliers"
repository = "https://github.com/jeff-hykin/depth2depth"
readme = "README.md"
keywords = ["depth", "vision", "candle", "realsense", "robotics"]
categories = ["computer-vision", "science::robotics"]

[dependencies]
candle = { version = "0.11", package = "candle-core" }
candle-nn = "0.11"
kiddo = "5"
rayon = "1"

[build-dependencies]
cc = "1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[features]
# The model files built into the library (see model.json / build.rs); without it, load them by path.
default = ["embedded-model"]
embedded-model = []
cuda = ["candle/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle/cudnn"]
metal = ["candle/metal", "candle-nn/metal"]
# Depth Anything through TensorRT on NVIDIA (Jetson) GPUs; needs TensorRT and CUDA installed (see build.rs).
tensorrt = []

[[example]]
name = "clip"
